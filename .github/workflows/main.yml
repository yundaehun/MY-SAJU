
name: MY SAJU Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 프로그램 설치
        working-directory: my_saju
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 템플릿 폴더 준비
        working-directory: my_saju
        shell: pwsh
        run: |
          if (Test-Path "템플릿") {
            Copy-Item "템플릿" "templates" -Recurse -Force
          }
          if (!(Test-Path "templates/index.html")) {
            throw "템플릿/index.html 파일을 찾을 수 없습니다."
          }

      - name: Windows 실행 파일 만들기
        working-directory: my_saju
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm",
            "--clean",
            "--onedir",
            "--name", "MY_SAJU",
            "--collect-all", "flask",
            "--add-data", "templates;templates"
          )
          if (Test-Path "static") {
            $args += @("--add-data", "static;static")
          }
          & pyinstaller @args app.py
          if ($LASTEXITCODE -ne 0) {
            throw "EXE 제작 실패"
          }

      - name: 완성 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: MY-SAJU-Windows
          path: my_saju/dist/MY_SAJU/
