
name: MY SAJU Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 프로그램 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Windows 실행 파일 만들기
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm",
            "--clean",
            "--onedir",
            "--name", "MY_SAJU",
            "--add-data", "templates;templates"
          )
          if (Test-Path "static") {
            $args += @("--add-data", "static;static")
          }
          & pyinstaller @args app.py

      - name: 완성 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: MY-SAJU-Windows
          path: dist/MY_SAJU/
